$kind: http-request
name: 'Get Lesson'
method: GET
url: '{{baseUrl}}/api/lessons/{{lessonId}}'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 404", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      if (pm.response.code === 200) {
        pm.test("Response contains lesson object", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("lesson");
          pm.expect(json.lesson).to.have.property("_id");
        });
      }
