$kind: http-request
name: 'Create Task - Invalid Priority'
method: POST
url: '{{baseUrl}}/api/tasks'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Bad priority task",
      "priority": "urgent"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400 Bad Request", function () {
        pm.response.to.have.status(400);
      });

      pm.test("Error message mentions priority", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("message");
        pm.expect(json.message.toLowerCase()).to.include("priority");
      });
