$kind: http-request
name: 'Update Task'
method: PATCH
url: '{{baseUrl}}/api/tasks/{{taskId}}'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Study for exam (updated)",
      "isCompleted": true,
      "priority": "medium"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response contains updated task", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("task");
        pm.expect(json.task).to.have.property("_id");
      });

      pm.test("Task isCompleted is true", function () {
        const json = pm.response.json();
        pm.expect(json.task.isCompleted).to.be.true;
      });
