$kind: http-request
name: Register
method: POST
url: '{{baseUrl}}/api/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test User",
      "email": "testuser@noducks.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 Created", function () {
        pm.response.to.have.status(201);
      });

      pm.test("Response has success message", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("message");
        pm.expect(json.message).to.include("registered");
      });

      pm.test("Response contains user object", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("user");
        pm.expect(json.user).to.have.property("id");
        pm.expect(json.user).to.have.property("name");
        pm.expect(json.user).to.have.property("email");
      });
