$kind: http-request
name: 'Get Latest Update - No Auth'
method: GET
url: '{{baseUrl}}/api/updates/latest'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401 Unauthorized without token", function () {
        pm.response.to.have.status(401);
      });
