$kind: http-request
name: 'Create Note - Missing Title'
method: POST
url: '{{baseUrl}}/api/notes'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "description": "A note without a title"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400 Bad Request", function () {
        pm.response.to.have.status(400);
      });

      pm.test("Error message mentions title", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("message");
        pm.expect(json.message.toLowerCase()).to.include("title");
      });
